<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Diwali Dash</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:#070b22;touch-action:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,10,.55) 100%)}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000a}
#hud{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;gap:10px}
.pill{background:rgba(10,8,35,.55);border:1.5px solid rgba(255,196,90,.55);border-radius:16px;padding:6px 14px;backdrop-filter:blur(4px);min-width:92px}
.pill .lbl{display:block;font-size:10px;letter-spacing:2px;color:#ffd78a}
.pill b{font-size:26px;color:#ffe08a;line-height:1}
.pill small{display:block;font-size:11px;color:#c9c2e8;margin-top:2px}
#hearts{font-size:22px;letter-spacing:2px;align-self:flex-start;padding:8px 14px}
#combo{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-weight:900;font-size:22px;color:#ff9f43;background:rgba(10,8,35,.55);border:1.5px solid #ff9f43;border-radius:999px;padding:4px 16px}
#pw{position:absolute;left:14px;top:84px;display:flex;flex-direction:column;gap:6px}
.chip{background:rgba(10,8,35,.6);border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
#mute{position:absolute;right:14px;top:62px;pointer-events:auto;width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:rgba(10,8,35,.55);font-size:18px;cursor:pointer;color:#fff}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:auto;padding:16px}
.card{background:linear-gradient(160deg,rgba(24,12,52,.88),rgba(8,6,28,.9));border:2px solid rgba(255,190,70,.75);border-radius:26px;padding:26px 28px 22px;max-width:440px;box-shadow:0 0 60px rgba(255,150,40,.25),0 15px 50px #000a}
.card h1{margin:0 0 6px;font-size:40px;color:#ffd45c;text-shadow:0 0 18px #ff9a1f}
.card p{margin:8px 0 14px;color:#eee;line-height:1.45}
.card ul{list-style:none;padding:0;margin:10px 0 16px;text-align:left;font-size:14px;color:#ddd;line-height:1.9}
.card ul b{color:#ffd45c}
.stat{display:flex;justify-content:space-around;margin:12px 0 16px;font-size:13px;color:#cbbfe8}
.stat b{display:block;font-size:24px;color:#ffe08a}
.btn{border:0;border-radius:999px;padding:14px 30px;font-weight:900;font-size:18px;background:linear-gradient(#ffcf4a,#ff9a1f);color:#2a1300;cursor:pointer;box-shadow:0 6px 0 #b45f0a,0 10px 24px #0007;letter-spacing:1px}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b45f0a}
.btn.alt{background:rgba(255,255,255,.12);color:#ffe9b8;box-shadow:0 4px 0 rgba(0,0,0,.35);border:1.5px solid rgba(255,200,120,.6);margin-left:10px;padding:12px 24px;font-size:16px}
.hint{font-size:12px;color:#a9a3c8;margin-top:14px}
.hidden{display:none!important}
.tb{position:absolute;bottom:26px;width:96px;height:96px;border-radius:50%;border:2.5px solid #fff9;font-weight:900;font-size:16px;box-shadow:0 8px 25px #0007;pointer-events:auto;cursor:pointer}
#bJump{right:22px;background:#ffb52e;color:#251300}
#bDuck{left:22px;background:#6c8cff;color:#0a1030}
</style></head><body>
<canvas id="c"></canvas><div id="vig"></div>
<div id="ui">
 <div id="hud">
  <div class="pill"><span class="lbl">SCORE</span><b id="score">0</b><small>BEST <span id="best">0</span></small></div>
  <div id="combo" class="hidden"></div>
  <div class="pill" id="hearts"></div>
 </div>
 <div id="pw"></div>
 <button id="mute" aria-label="Mute">🔊</button>
 <div id="msg"><div class="card" id="card"></div></div>
 <button id="bDuck" class="tb hidden">DUCK</button>
 <button id="bJump" class="tb hidden">JUMP</button>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
if(!ctx.roundRect)ctx.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hs=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const pick=a=>a[Math.random()*a.length|0];

/* ---------- screen / world scaling ---------- */
let W=0,H=0,dpr=1,S=1,VW=800,VH=600,GY=480;
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);S=Math.min(H/600,W/640);VW=W/S;VH=H/S;GY=Math.round(VH*.8)}
addEventListener('resize',resize);resize();

/* ---------- colour helpers ---------- */
const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const PAL=[['#06102e','#1a1650','#3a2040'],['#0a0a2a','#2b1352','#6a2450'],['#12082e','#3a1458','#8a3050'],['#05182e','#12305a','#356070'],['#14082e','#40135e','#9a3a40']].map(p=>p.map(hex2rgb));
const NAMES=['Dhanteras','Choti Diwali','Lakshmi Puja','Govardhan Puja','Bhai Dooj'];
let palCur=PAL[0].map(c=>c.slice());

/* ---------- glow sprites ---------- */
const gc={};
function glowImg(c){return gc[c]||(gc[c]=(()=>{const k=document.createElement('canvas');k.width=k.height=64;const x=k.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,c);g.addColorStop(.3,c+'aa');g.addColorStop(1,c+'00');x.fillStyle=g;x.fillRect(0,0,64,64);return k})())}
function glow(c,x,y,r,a=1){ctx.globalAlpha=a;ctx.drawImage(glowImg(c),x-r,y-r,r*2,r*2);ctx.globalAlpha=1}

/* ---------- audio ---------- */
let ac=null,master=null,musicBus=null,muted=false,mTimer=null,mStep=0;
function initAudio(){try{
 if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:.8;
  const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
  musicBus=ac.createGain();musicBus.gain.value=.45;musicBus.connect(master);
  const dl=ac.createDelay(1),fb=ac.createGain(),wet=ac.createGain();dl.delayTime.value=.3;fb.gain.value=.3;wet.gain.value=.3;
  musicBus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master)}
 if(ac.state==='suspended')ac.resume()}catch(e){ac=null}}
function tone(f,d,type='sine',v=.2,when=0,f2=null,dest=null){if(!ac)return;const t0=ac.currentTime+when,o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(v,t0+.008);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(gn);gn.connect(dest||master);o.start(t0);o.stop(t0+d+.03)}
function noise(d,v=.2,when=0,lp=0,dest=null){if(!ac)return;const t0=ac.currentTime+when,n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.exp(-i/(n*.25));const s=ac.createBufferSource(),gn=ac.createGain();s.buffer=b;gn.gain.value=v;if(lp){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;s.connect(f);f.connect(gn)}else s.connect(gn);gn.connect(dest||master);s.start(t0)}
const sfx={
 jump(n){tone(n?520:380,.16,'triangle',.14,0,n?980:760)},
 coin(ch){const f=880*Math.pow(1.0595,Math.min(ch,12));tone(f,.09,'sine',.14);tone(f*1.5,.16,'sine',.12,.07)},
 flower(){tone(660,.2,'triangle',.14);tone(990,.25,'triangle',.1,.06)},
 power(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.14,i*.06))},
 hit(){tone(220,.35,'sawtooth',.25,0,40);noise(.3,.4,0,1800)},
 cracker(v=.18){if(!ac)return;for(let k=0;k<3;k++)tone(1600+Math.random()*900,.09,k?'sawtooth':'square',v,k*.055,180+Math.random()*120);noise(.18,v*1.2,.03,5000)},
 boom(v=.1){noise(.7,v,0,700);tone(90,.5,'sine',v*1.4,0,35)},
 over(){[392,330,262,196].forEach((f,i)=>tone(f,.3,'triangle',.18,i*.14))},
 stage(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.13,i*.07))}
};
const SC=[1,9/8,5/4,3/2,5/3,2,9/4];
const MEL=[0,-1,2,-1,3,2,-1,1,0,-1,2,3,4,3,2,-1,4,-1,3,-1,2,3,-1,1,0,-1,1,2,0,-1,-1,-1];
function musicStep(){if(!ac||st!=='play')return;const s=mStep%32;
 if(s%8===0||s%16===6||s%16===11)tone(140,.2,'sine',.7,0,50,musicBus);
 if(s%2===1)noise(.05,.1,0,9000,musicBus);else noise(.03,.04,0,12000,musicBus);
 if(s%4===2)tone(300,.07,'square',.05,0,180,musicBus);
 const m=MEL[s];if(m>=0)tone(293.66*SC[m],.35,'triangle',.22,0,null,musicBus);
 if(s%8===0)tone(s%16===8?220:146.8,.6,'sine',.3,0,null,musicBus);
 mStep++}
function startMusic(){clearInterval(mTimer);mStep=0;mTimer=setInterval(musicStep,234)}
function stopMusic(){clearInterval(mTimer);mTimer=null}

/* ---------- state ---------- */
let st='menu',g=null,best=0,keysDown=false,touchDuck=false,tm=0,last=0;
try{best=+localStorage.getItem('diwaliDashBest')||0}catch(e){}
function reset(){g={t:0,dist:0,score:0,coins:0,lives:3,chain:0,combo:1,comboT:0,speed:380,scroll:0,spawnX:260,items:[],obs:[],parts:[],bg:[],fw:[],pops:[],shake:0,flash:0,inv:0,magnet:0,shield:0,dbl:0,stage:0,banner:0,bText:'',fwT:.3,popT:2,p:{h:0,vy:0,jumps:0,duck:false,anim:0,x:150,land:0}}}
reset();

/* ---------- particles ---------- */
function addP(a,o){if(a.length<900)a.push(o)}
function spark(a,x,y,c,n,spd=160,life=.7,grav=420,r=7){for(let i=0;i<n;i++){const an=Math.random()*TAU,s=rnd(.2,1)*spd,l=life*rnd(.6,1);addP(a,{x,y,vx:Math.cos(an)*s,vy:Math.sin(an)*s-spd*.2,life:l,max:l,c,r:r*rnd(.6,1),g:grav,d:1.2})}}
function stepParts(a,dt){let j=0;for(let i=0;i<a.length;i++){const p=a[i];p.vx*=1-p.d*dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life>0)a[j++]=p}a.length=j}
function drawParts(a,k=1){ctx.globalCompositeOperation='lighter';for(const p of a){const al=clamp(p.life/p.max,0,1);glow(p.c,p.x,p.y,p.r*(.5+al*.8),al*k)}ctx.globalCompositeOperation='source-over'}
const FWC=['#ffd34e','#ff5ca8','#ff7a2b','#5cd6ff','#9b7bff','#7dff9b','#ff4d4d','#ffffff'];
function explode(a,x,y,loud){const kind=Math.random(),c1=pick(FWC),c2=pick(FWC),willow=kind>=.5&&kind<.8,n=kind<.5?46:willow?38:56;
 for(let i=0;i<n;i++){const an=i/n*TAU+rnd(-.05,.05);let s=kind<.5?rnd(150,210):willow?rnd(80,200):rnd(40,240);const l=willow?rnd(1.4,2):rnd(.9,1.4);
  addP(a,{x,y,vx:Math.cos(an)*s,vy:Math.sin(an)*s,life:l,max:l,c:i%2?c1:c2,r:willow?9:8,g:willow?220:140,d:willow?1.1:.9})}
 if(loud)sfx.boom(loud)}
function pop(x,y,txt,c='#ffe08a'){g.pops.push({x,y,txt,c,t:1})}

/* ---------- spawning ---------- */
const OB={crate:{w:38,t:42,b:0},bomb:{w:36,t:36,b:0},chakra:{w:58,t:18,b:0},rocket:{w:52,t:22,b:50},tower:{w:40,t:96,b:0}};
function addObs(type,x){g.obs.push(Object.assign({type,x,ph:rnd(0,6)},OB[type]))}
function addItem(type,x,h){g.items.push({type,x,h,r:type==='coin'?13:type==='flower'?15:19,ph:rnd(0,6)})}
function spawnPattern(){
 const x0=VW+90,d=g.dist,r=Math.random();
 const type=r<.2?'crate':r<.38?'bomb':r<.52?'chakra':r<.76?'rocket':'tower';
 addObs(type,x0);const o=OB[type];
 if(type==='rocket'){for(let i=0;i<5;i++)addItem('coin',x0-40+i*34,22)}
 else{const top=o.t+30,n=7;for(let i=0;i<n;i++){const k=i/(n-1);addItem('coin',x0-90+k*180,top+Math.sin(k*Math.PI)*(type==='tower'?36:56))}}
 let end=x0+110,extra=0;
 if(d>350&&Math.random()<.35){addObs(pick(['crate','bomb','chakra']),x0+260);end=x0+380;extra=140}
 if(Math.random()<.35){const h=Math.random()<.5?150:50;for(let i=0;i<3;i++)addItem('flower',end+i*38,h)}
 if(Math.random()<.1)addItem(pick(['mag','shd','x2']),end+40,100);
 g.spawnX=rnd(420,600)-Math.min(150,d*.04)+extra}

/* ---------- input ---------- */
function jump(){if(st!=='play')return;const p=g.p;if(p.jumps>=2)return;p.vy=p.jumps===0?880:780;p.jumps++;sfx.jump(p.jumps>1);spark(g.parts,p.x,GY-p.h,p.jumps>1?'#9fd4ff':'#ffd34e',p.jumps>1?14:8,120,.5,300,6)}
addEventListener('keydown',e=>{
 if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(st==='menu'||st==='over'){if(!e.repeat)startGame()}else if(!e.repeat)jump()}
 else if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();keysDown=true}
 else if(e.code==='KeyP'||e.code==='Escape'){togglePause()}
 else if(e.code==='KeyM')toggleMute()
 else if(e.code==='Enter'&&(st==='menu'||st==='over'))startGame()});
addEventListener('keyup',e=>{if(['ArrowDown','KeyS'].includes(e.code))keysDown=false});
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(st==='play')jump()});
const bJ=$('bJump'),bD=$('bDuck');
bJ.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
bD.addEventListener('pointerdown',e=>{e.preventDefault();touchDuck=true});
['pointerup','pointercancel','pointerleave'].forEach(ev=>bD.addEventListener(ev,()=>{touchDuck=false}));
function toggleMute(){muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:.8}
$('mute').addEventListener('click',toggleMute);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play')togglePause()});
const touchy='ontouchstart' in window||navigator.maxTouchPoints>0;

/* ---------- flow ---------- */
function card(html){$('card').innerHTML=html;$('msg').classList.remove('hidden')}
function showMenu(){card(`<h1>🪔 Diwali Dash</h1><p>Run through the festival night, dodge the crackers, collect the lights!</p><ul><li>⬆️ <b>Jump</b> — Space / ↑ / tap (tap again for a <b>double jump</b>)</li><li>⬇️ <b>Duck</b> — hold ↓ / S to slide under rockets</li><li>🪙 Chain coins for <b>combo multipliers</b></li><li>🧲 🛡️ ✖2 Grab glowing power-ups</li></ul><button class="btn" id="start">START GAME</button><div class="hint">Best: ${best} · P pause · M mute</div>`);$('start').onclick=startGame}
function startGame(){initAudio();reset();st='play';$('msg').classList.add('hidden');if(touchy){bJ.classList.remove('hidden');bD.classList.remove('hidden')}
 g.banner=3.2;g.bText='DAY 1 · '+NAMES[0].toUpperCase();startMusic()}
function togglePause(){if(st==='play'){st='pause';stopMusic();card(`<h1>⏸ Paused</h1><p>Take a breath. The crackers will wait.</p><button class="btn" id="res">RESUME</button><button class="btn alt" id="exit">EXIT</button>`);$('res').onclick=togglePause;$('exit').onclick=exitGame}
 else if(st==='pause'){st='play';$('msg').classList.add('hidden');last=performance.now();startMusic()}}
function exitGame(){stopMusic();st='menu';reset();touchDuck=false;keysDown=false;bJ.classList.add('hidden');bD.classList.add('hidden');
 card(`<h1>🙏 Thanks for playing!</h1><p>Happy Diwali! 🪔<br>Your best score: <b>${best}</b></p><button class="btn" id="back">MAIN MENU</button>`);$('back').onclick=showMenu}
function gameOver(){st='over';stopMusic();sfx.over();bJ.classList.add('hidden');bD.classList.add('hidden');touchDuck=false;
 const sc=Math.floor(g.score),nb=sc>best;if(nb){best=sc;try{localStorage.setItem('diwaliDashBest',best)}catch(e){}}
 card(`<h1>${nb?'🎆 New Best!':'💥 Game Over'}</h1><p>The crackers got you on <b>Day ${g.stage%5+1}</b>.</p><div class="stat"><div><b>${sc}</b>SCORE</div><div><b>${Math.floor(g.dist)}m</b>DISTANCE</div><div><b>${g.coins}</b>COINS</div></div><button class="btn" id="again">PLAY AGAIN</button><button class="btn alt" id="exit">EXIT</button><div class="hint">Best: ${best}</div>`);$('again').onclick=startGame;$('exit').onclick=exitGame}

/* ---------- update ---------- */
function updateCommon(dt){
 const tp=PAL[g.stage%PAL.length];for(let i=0;i<3;i++)palCur[i]=mix(palCur[i],tp[i],Math.min(1,dt*.8));
 g.fwT-=dt;if(g.fwT<=0){g.fw.push({x:rnd(VW*.08,VW*.92),y:GY-40,vy:-rnd(330,470)});g.fwT=rnd(1.8,3.6)}
 for(const f of g.fw){f.y+=f.vy*dt;f.vy+=260*dt;addP(g.bg,{x:f.x+rnd(-2,2),y:f.y,vx:rnd(-8,8),vy:rnd(10,30),life:.5,max:.5,c:'#ffcf7a',r:5,g:0,d:1});if(f.vy>-30){f.dead=true;explode(g.bg,f.x,f.y,st==='play'?.06:0)}}
 g.fw=g.fw.filter(f=>!f.dead);stepParts(g.bg,dt);stepParts(g.parts,dt);
 for(const p of g.pops){p.y-=60*dt;p.t-=dt}g.pops=g.pops.filter(p=>p.t>0);
 g.shake=Math.max(0,g.shake-dt*18);g.flash=Math.max(0,g.flash-dt*2.5)}
function updateIdle(dt){g.scroll+=(st==='menu'?130:50)*dt;const p=g.p;if(st==='menu'){p.anim+=dt*9;addP(g.parts,{x:p.x+32,y:GY-66,vx:rnd(-60,20),vy:rnd(-120,-10),life:.35,max:.35,c:Math.random()<.5?'#ffe27a':'#ffffff',r:5,g:300,d:1})}updateCommon(dt)}
function hit(o){
 if(g.inv>0)return;
 const p=g.p,cx=p.x,cy=GY-p.h-30;
 if(g.shield>0){g.shield=0;g.inv=.9;g.shake=6;spark(g.parts,cx,cy,'#7fd0ff',34,260,.7,200,9);sfx.cracker(.2);if(o)o.dead=true;pop(cx,cy-40,'SHIELD!','#9fe0ff');return}
 g.lives--;g.inv=1.7;g.shake=14;g.flash=1;g.chain=0;g.combo=1;g.comboT=0;sfx.hit();spark(g.parts,cx,cy,'#ff5b4d',40,280,.8,400,9);spark(g.parts,cx,cy,'#ffd34e',24,200,.7,400,7);if(o)o.dead=true;
 if(g.lives<=0)gameOver()}
function collect(it){
 const sc=g.dbl>0?2:1;it.dead=true;
 if(it.type==='coin'||it.type==='flower'){g.chain++;g.comboT=2.2;g.combo=Math.min(8,1+Math.floor(g.chain/6));
  const v=(it.type==='coin'?10:25)*g.combo*sc;g.score+=v;if(it.type==='coin'){g.coins++;sfx.coin(g.chain)}else sfx.flower();
  spark(g.parts,it.x,GY-it.h,it.type==='coin'?'#ffd34e':'#ff72c6',10,130,.5,200,6);pop(it.x,GY-it.h-14,'+'+v,it.type==='coin'?'#ffe08a':'#ff9ad5')}
 else{sfx.power();spark(g.parts,it.x,GY-it.h,'#ffffff',28,220,.7,100,8);
  if(it.type==='mag'){g.magnet=8;pop(it.x,GY-it.h-20,'MAGNET!','#ff7a7a')}
  else if(it.type==='shd'){g.shield=12;pop(it.x,GY-it.h-20,'SHIELD!','#9fe0ff')}
  else{g.dbl=8;pop(it.x,GY-it.h-20,'DOUBLE SCORE!','#ffe08a')}}}
function updatePlay(dt){
 const p=g.p;g.t+=dt;g.speed=380+Math.min(340,g.dist*.14);const sp=g.speed;
 g.scroll+=sp*dt;g.dist+=sp*dt/20;g.score+=sp*dt/40;
 const stg=Math.floor(g.dist/600);
 if(stg!==g.stage){g.stage=stg;g.banner=3.2;g.bText='DAY '+(stg%5+1)+' · '+NAMES[stg%5].toUpperCase();sfx.stage();for(let i=0;i<4;i++)explode(g.bg,rnd(VW*.2,VW*.8),rnd(60,GY*.5),0);if(g.lives<3){g.lives++;pop(p.x,GY-120,'+1 LIFE','#ff9ad5')}}
 g.banner=Math.max(0,g.banner-dt);
 // player
 const want=keysDown||touchDuck,was=p.h>0;
 p.vy-=(want&&p.h>0?4800:2400)*dt;p.h+=p.vy*dt;
 if(p.h<=0){if(was&&p.vy<-250){spark(g.parts,p.x,GY,'#ffcf9a',10,110,.4,200,6);p.land=.18}p.h=0;p.vy=0;p.jumps=0}
 p.duck=want&&p.h===0;p.anim+=dt*sp/38;p.land=Math.max(0,p.land-dt);
 if(!p.duck)for(let i=0;i<2;i++)addP(g.parts,{x:p.x+32,y:GY-p.h-66,vx:rnd(-60,20)-sp*.15,vy:rnd(-120,-10),life:.35,max:.35,c:Math.random()<.5?'#ffe27a':'#ffffff',r:5,g:300,d:1});
 g.inv=Math.max(0,g.inv-dt);g.magnet=Math.max(0,g.magnet-dt);g.shield=Math.max(0,g.shield-dt);g.dbl=Math.max(0,g.dbl-dt);
 g.comboT-=dt;if(g.comboT<=0&&g.chain>0){g.chain=0;g.combo=1}
 // spawn
 g.spawnX-=sp*dt;if(g.spawnX<=0)spawnPattern();
 g.popT-=dt;if(g.popT<=0){g.popT=rnd(.8,2.2);sfx.cracker(.05);const x=rnd(0,VW),y=GY-rnd(0,30);spark(g.bg,x,y,pick(FWC),10,100,.4,200,6)}
 // items
 const pcx=p.x,pcy=GY-p.h-(p.duck?18:37);
 for(const it of g.items){it.x-=sp*dt;
  if(g.magnet>0&&(it.type==='coin'||it.type==='flower')){const dx=pcx-it.x,dy=pcy-(GY-it.h),d=Math.hypot(dx,dy);if(d<280&&d>1){const v=950*dt;it.x+=dx/d*v;it.h-=dy/d*v}}
  if(Math.hypot(it.x-pcx,GY-it.h-pcy)<it.r+22)collect(it)}
 g.items=g.items.filter(i=>!i.dead&&i.x>-80);
 // obstacles
 const L=p.x-14,R=p.x+14,T=GY-p.h-(p.duck?34:72)+4,B=GY-p.h-1;
 for(const o of g.obs){o.x-=sp*dt*(o.type==='rocket'?1.38:1);o.ph+=dt*8;
  if(o.x<VW+40){const top=GY-o.b-o.t;
   if(o.type==='tower'&&Math.random()<.7)addP(g.parts,{x:o.x+rnd(-8,8),y:top,vx:rnd(-40,40),vy:-rnd(200,380),life:.6,max:.6,c:Math.random()<.5?'#ffd34e':'#ff8a2b',r:7,g:600,d:.4});
   if(o.type==='chakra'&&Math.random()<.8){const a=o.ph;addP(g.parts,{x:o.x+Math.cos(a)*24,y:GY-9,vx:Math.cos(a)*120,vy:-rnd(60,200),life:.4,max:.4,c:pick(['#ffd34e','#ff5ca8','#7dff9b']),r:6,g:500,d:.5})}
   if(o.type==='rocket')addP(g.parts,{x:o.x+34,y:GY-o.b-11+rnd(-3,3),vx:rnd(20,80),vy:rnd(-20,20),life:.45,max:.45,c:pick(['#ff8a2b','#ffd34e']),r:9,g:0,d:1});
   if((o.type==='crate'||o.type==='bomb')&&Math.random()<.6)addP(g.parts,{x:o.x+(o.type==='crate'?8:10),y:top-(o.type==='crate'?14:14),vx:rnd(-40,40),vy:-rnd(20,100),life:.3,max:.3,c:'#ffe27a',r:5,g:300,d:1})}
  const l=o.x-o.w/2+5,r=o.x+o.w/2-5,t=GY-o.b-o.t+4,b=GY-o.b-2;
  if(R>l&&L<r&&B>t&&T<b){hit(o);if(st!=='play')return}}
 g.obs=g.obs.filter(o=>!o.dead&&o.x>-120);
 updateCommon(dt)}
