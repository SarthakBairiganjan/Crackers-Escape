<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Diwali Dash</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#070b22}body{display:flex;align-items:center;justify-content:center}canvas{width:100vw;height:100vh;display:block;background:linear-gradient(#07102f 0%,#1a1650 62%,#301c35 100%)}#ui{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #000}#top{display:flex;justify-content:space-between;padding:14px 18px;font-weight:800;font-size:18px}#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:auto}.card{background:rgba(5,8,25,.78);border:2px solid rgba(255,190,70,.7);border-radius:22px;padding:26px 28px;max-width:420px;box-shadow:0 15px 50px #0008}.card h1{margin:0 0 8px;font-size:40px;color:#ffd45c}.card p{margin:8px 0 18px;color:#eee}.btn{border:0;border-radius:999px;padding:13px 24px;font-weight:900;font-size:17px;background:#ffb52e;color:#241100;cursor:pointer}.hint{font-size:13px;color:#bbb;margin-top:12px}.hidden{display:none!important}#jump{position:fixed;right:22px;bottom:22px;width:88px;height:88px;border-radius:50%;border:2px solid #fff8;background:#ffb52e;color:#251300;font-weight:900;font-size:15px;box-shadow:0 8px 25px #0007}
</style></head><body><canvas id="c"></canvas><div id="ui"><div id="top"><div>🧨 Diwali Dash</div><div>⭐ <span id="score">0</span> &nbsp; ❤️ <span id="lives">3</span></div></div><div id="msg"><div class="card"><h1>🪔 Diwali Dash</h1><p>Run, jump and collect coins & flowers.<br>Escape the crackers!</p><button class="btn" id="start">START GAME</button><div class="hint">Space / ↑ / tap to jump</div></div></div></div><button id="jump" class="hidden">JUMP</button>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,dpr=1;function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
let running=false,score=0,lives=3,t=0,last=0,speed=330,spawn=0,items=[],crackers=[],fireworks=[],particles=[],boy={x:100,y:0,vy:0,onGround:true,frame:0};
const ground=()=>H*.78;
// Boy sprite: a clean, cap-wearing runner illustration, inspired by the uploaded reference's cap-wearing boy concept. The uploaded file is a Google Images results page, not a single source image. 
function drawBoy(x,y){ctx.save();ctx.translate(x,y);let bob=Math.sin(boy.frame*.45)*1.5;ctx.translate(0,bob);let run=Math.sin(boy.frame*.65)*7;
 // shadow
 ctx.globalAlpha=.28;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,4,25,7,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 // legs
 ctx.strokeStyle='#1d2442';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-5,-6);ctx.lineTo(-12+run*.45,13);ctx.moveTo(5,-6);ctx.lineTo(13-run*.45,13);ctx.stroke();
 ctx.strokeStyle='#f1f1f1';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-12+run*.45,13);ctx.lineTo(-20+run*.45,14);ctx.moveTo(13-run*.45,13);ctx.lineTo(21-run*.45,14);ctx.stroke();
 // torso
 ctx.fillStyle='#1976d2';ctx.beginPath();ctx.roundRect(-15,-35,30,34,9);ctx.fill();
 // arms
 ctx.strokeStyle='#f0b184';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-13,-28);ctx.lineTo(-27-run*.55,-12);ctx.moveTo(13,-28);ctx.lineTo(27+run*.55,-18);ctx.stroke();
 // neck/head
 ctx.fillStyle='#f0b184';ctx.fillRect(-5,-41,10,9);ctx.beginPath();ctx.arc(0,-51,15,0,Math.PI*2);ctx.fill();
 // hair
 ctx.fillStyle='#24170f';ctx.beginPath();ctx.arc(0,-56,14,Math.PI,Math.PI*2);ctx.fill();
 // cap
 ctx.fillStyle='#e53935';ctx.beginPath();ctx.arc(0,-61,14,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-14,-61,28,5);ctx.beginPath();ctx.ellipse(10,-57,13,4,.05,0,Math.PI*2);ctx.fill();
 // face
 ctx.fillStyle='#171717';ctx.beginPath();ctx.arc(5,-51,1.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#8d4b35';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(5,-47,5,0,Math.PI);ctx.stroke();
 ctx.restore()}
function coin(x,y){ctx.save();ctx.translate(x,y);let s=1+Math.sin(t*.12+x)*.08;ctx.scale(s,1);ctx.fillStyle='#ffd43b';ctx.strokeStyle='#fff0a0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#9a5a00';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('₹',0,1);ctx.restore()}
function flower(x,y){ctx.save();ctx.translate(x,y);let r=9;for(let i=0;i<6;i++){ctx.rotate(Math.PI/3);ctx.fillStyle=i%2?'#ff5ca8':'#ff8a2b';ctx.beginPath();ctx.ellipse(0,-r,5,10,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#ffd84d';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();ctx.restore()}
function diya(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#d86b24';ctx.beginPath();ctx.ellipse(0,7,18,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd35a';ctx.beginPath();ctx.moveTo(0,-12);ctx.quadraticCurveTo(-7,-3,0,3);ctx.quadraticCurveTo(7,-3,0,-12);ctx.fill();ctx.restore()}
function cracker(o){ctx.save();ctx.translate(o.x,o.y);if(o.type==='rocket'){ctx.strokeStyle='#eee';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,12,0,-15);ctx.stroke();ctx.fillStyle='#e53935';ctx.beginPath();ctx.roundRect(-7,-25,14,28,4);ctx.fill();ctx.fillStyle='#ffb300';ctx.beginPath();ctx.arc(0,-28,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ff7a00';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,5);ctx.lineTo(-7,17);ctx.moveTo(0,5);ctx.lineTo(7,17);ctx.stroke()}else if(o.type==='flower'){ctx.fillStyle='#d32f2f';ctx.beginPath();ctx.roundRect(-12,-17,24,28,5);ctx.fill();ctx.fillStyle='#ffd54f';ctx.fillRect(-8,-12,16,4);ctx.strokeStyle='#ff9f00';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-10,13);ctx.lineTo(10,13);ctx.stroke()}else{ctx.fillStyle=o.type==='bomb'?'#242424':'#d52d2d';ctx.beginPath();ctx.roundRect(-13,-14,26,28,6);ctx.fill();ctx.fillStyle='#ffd54f';ctx.fillRect(-9,-9,18,4);ctx.fillRect(-9,0,18,4);ctx.strokeStyle='#ffd54f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-14);ctx.quadraticCurveTo(10,-25,6,-31);ctx.stroke()}ctx.restore()}
function burst(x,y,kind='gold'){for(let i=0;i<28;i++){let a=Math.random()*Math.PI*2,s=60+Math.random()*170;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:.8+Math.random()*.5,c:kind==='red'?'#ff5b4d':kind==='pink'?'#ff72c6':'#ffd34e'})}}
function crackerSound(){if(!audio)return;let now=audio.currentTime; // layered firecracker: sharp snap + noisy crackle + low thump
 for(let k=0;k<3;k++){let o=audio.createOscillator(),g=audio.createGain();o.type=k===0?'square':'sawtooth';o.frequency.setValueAtTime(1600+Math.random()*900,now+k*.055);o.frequency.exponentialRampToValueAtTime(180+Math.random()*120,now+k*.055+.09);g.gain.setValueAtTime(.0001,now+k*.055);g.gain.exponentialRampToValueAtTime(.18,now+k*.055+.006);g.gain.exponentialRampToValueAtTime(.0001,now+k*.055+.11);o.connect(g).connect(audio.destination);o.start(now+k*.055);o.stop(now+k*.055+.12)}
 let b=audio.createBuffer(1,audio.sampleRate*.18,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(audio.sampleRate*.035));let s=audio.createBufferSource(),g=audio.createGain();g.gain.value=.25;s.buffer=b;s.connect(g).connect(audio.destination);s.start(now+.03)}
function jumpSound(){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(420,audio.currentTime);o.frequency.exponentialRampToValueAtTime(780,audio.currentTime+.13);g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.16);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.17)}
let audio=null,crackerTimer=null;function startAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();clearInterval(crackerTimer);crackerTimer=setInterval(()=>{if(running&&Math.random()<.9)crackerSound()},900)}catch(e){}}
function stopAudio(){clearInterval(crackerTimer);crackerTimer=null}
function jump(){if(!running||!boy.onGround)return;boy.vy=-720;boy.onGround=false;boy.frame+=2;jumpSound();burst(boy.x+18,boy.y-35,'gold')}
addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();jump()}});document.getElementById('jump').addEventListener('pointerdown',jump);
function spawnItem(){let r=Math.random(),type=r<.58?'coin':r<.9?'flower':'diya';items.push({type,x:W+40,y:ground()-(type==='diya'?8:55+Math.random()*100),r:15})}
function spawnCracker(){let r=Math.random();let type=r<.25?'rocket':r<.48?'flower':r<.72?'bomb':'ground';let y=type==='rocket'?ground()-120:ground()-20;crackers.push({type,x:W+45,y,w:30,h:35})}
function fireworksTick(){if(Math.random()<.055){fireworks.push({x:W*.15+Math.random()*W*.7,y:80+Math.random()*H*.28,life:1,done:false});}}
function update(dt){t+=dt;boy.frame+=dt*12;speed=330+Math.min(220,t*3);boy.vy+=1850*dt;boy.y+=boy.vy*dt;if(boy.y>=ground()-15){boy.y=ground()-15;boy.vy=0;boy.onGround=true}spawn-=dt;if(spawn<=0){spawnItem();spawnCracker();spawn=Math.max(.7,1.35-t/90)}fireworksTick();for(let a of items)a.x-=speed*dt;for(let a of crackers)a.x-=speed*dt;for(let f of fireworks)f.life-=dt;for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt}
 for(let a of items){if(Math.hypot(a.x-boy.x,a.y-(boy.y-35))<32){score+=a.type==='coin'?10:a.type==='flower'?15:5;a.dead=true;burst(a.x,a.y,a.type==='flower'?'pink':'gold')}}
 for(let a of crackers){if(Math.abs(a.x-boy.x)<27&&Math.abs(a.y-(boy.y-15))<38){a.dead=true;lives--;crackerSound();burst(a.x,a.y,'red');if(lives<=0)return end(false)}}items=items.filter(a=>!a.dead&&a.x>-50);crackers=crackers.filter(a=>!a.dead&&a.x>-60);fireworks=fireworks.filter(f=>f.life>0);particles=particles.filter(p=>p.life>0);if(t>=60)return end(true);document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives}
function draw(){ctx.clearRect(0,0,W,H); // stars
 for(let i=0;i<45;i++){let x=(i*97)%W,y=(i*53)%(H*.55);ctx.fillStyle='#ffffffaa';ctx.fillRect(x,y,2,2)}
 // fireworks
 for(let f of fireworks){let rr=(1-f.life)*95;ctx.globalAlpha=f.life;for(let i=0;i<18;i++){let a=i*Math.PI*2/18;ctx.strokeStyle=i%2?'#ff7ac8':'#ffd34e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(f.x+Math.cos(a)*rr*.2,f.y+Math.sin(a)*rr*.2);ctx.lineTo(f.x+Math.cos(a)*rr,f.y+Math.sin(a)*rr);ctx.stroke()}ctx.globalAlpha=1}
 // skyline
 ctx.fillStyle='#12153b';for(let x=0;x<W;x+=55){let h=25+(x*7%60);ctx.fillRect(x,ground()-h,43,h)}
 ctx.fillStyle='#19162b';ctx.fillRect(0,ground(),W,H-ground());
 for(let x=40;x<W;x+=130)diya(x,ground()-5);
 for(let a of items){if(a.type==='coin')coin(a.x,a.y);else if(a.type==='flower')flower(a.x,a.y);else diya(a.x,a.y)}
 for(let a of crackers)cracker(a);for(let p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;drawBoy(boy.x,boy.y)}
function loop(now){if(!running)return;let dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
function startGame(){startAudio();running=true;score=0;lives=3;t=0;items=[];crackers=[];fireworks=[];particles=[];boy.y=ground()-15;boy.vy=0;boy.onGround=true;document.getElementById('msg').classList.add('hidden');document.getElementById('jump').classList.remove('hidden');last=performance.now();requestAnimationFrame(loop)}
function end(win){running=false;stopAudio();document.getElementById('jump').classList.add('hidden');document.getElementById('msg').classList.remove('hidden');document.querySelector('.card').innerHTML=`<h1>${win?'🎆 Happy Diwali!':'💥 Game Over'}</h1><p>${win?'You survived the cracker run!':'The crackers got you!'}<br>Score: <b>${score}</b></p><button class="btn" id="again">PLAY AGAIN</button><div class="hint">Press Start to hear the cracker sounds</div>`;document.getElementById('again').onclick=startGame}
document.getElementById('start').onclick=startGame;
</script></body></html>
