<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Cracker Escape</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b24;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}#wrap{width:100vw;height:100vh;position:relative;overflow:hidden;background:#070b24}canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;padding:8px 14px;border:1px solid #ffffff33;border-radius:999px;background:#07102dcc;color:#fff;font-weight:700;font-size:14px;z-index:2}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#06091acc,#06091a88);z-index:5}.card{width:min(90%,420px);text-align:center;color:white;background:#10183be8;border:1px solid #ffffff25;border-radius:22px;padding:30px 24px;box-shadow:0 15px 60px #0009}.card h1{margin:0 0 8px;font-size:42px}.card p{opacity:.85}.btn{border:0;border-radius:999px;padding:13px 24px;background:#ffca28;color:#201500;font-weight:800;font-size:16px;cursor:pointer}.small{font-size:12px;opacity:.65;margin-top:14px}.jump{position:absolute;right:20px;bottom:20px;width:88px;height:88px;border-radius:50%;border:2px solid #ffffff66;background:#ffca28dd;font-size:16px;font-weight:900;z-index:3}.hidden{display:none}</style></head>
<body><div id="wrap"><canvas id="c"></canvas><div class="hud">❤️ <span id="lives">3</span><span>•</span>🏆 <span id="score">0</span><span>•</span>🪙 <span id="coins">0</span><span>•</span>⏱️ <span id="time">60</span></div><button class="jump" id="jumpBtn">JUMP</button>
<div class="screen" id="home"><div class="card"><div style="font-size:70px">🧨</div><h1>Cracker Escape</h1><p>Run, jump and survive the Diwali fireworks!</p><button class="btn" id="start">Start Game</button><div class="small">Space / ↑ / tap JUMP</div></div></div>
<div class="screen hidden" id="end"><div class="card"><div id="endIcon" style="font-size:70px">🎆</div><h1 id="endTitle">Game Over</h1><p id="endText"></p><button class="btn" id="again">Play Again</button><div class="small">Keep jumping to avoid the crackers.</div></div></div></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,dpr,groundY;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);groundY=H-105}addEventListener('resize',resize);resize();
let running=false,last=0,score=0,lives=3,time=60,coins=0,player,obs=[],coinArr=[],diyaArr=[],fw=[],particles=[],spawn=0,coinSpawn=0,fireSpawn=0,audioCtx=null,master=null,soundTimer=null;
function startSound(){if(audioCtx)return;audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.14;master.connect(audioCtx.destination);soundLoop()}
function pop(){if(!audioCtx||!running)return;const t=audioCtx.currentTime;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.55,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2);for(let i=0;i<4;i++){let n=audioCtx.createBufferSource(),b=audioCtx.createBuffer(1,audioCtx.sampleRate*.055,audioCtx.sampleRate),d=b.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,3);n.buffer=b;let ng=audioCtx.createGain();ng.gain.value=.09;ng.connect(master);n.connect(ng);n.start(t+.02+i*.025)}}
function soundLoop(){if(!running)return;pop();soundTimer=setTimeout(soundLoop,650+Math.random()*900)}
function stopSound(){if(soundTimer)clearTimeout(soundTimer);soundTimer=null;if(audioCtx){audioCtx.close();audioCtx=null;master=null}}
function reset(){score=0;lives=3;time=60;coins=0;obs=[];coinArr=[];diyaArr=[];fw=[];particles=[];spawn=0;coinSpawn=.4;fireSpawn=.2;player={x:110,y:groundY-58,w:42,h:58,vy:0,onGround:true};for(let i=0;i<7;i++)diyaArr.push({x:i*170+40})}
function startGame(){reset();running=true;document.getElementById('home').classList.add('hidden');document.getElementById('end').classList.add('hidden');startSound();last=performance.now();requestAnimationFrame(loop)}
function finish(win){running=false;stopSound();document.getElementById('endTitle').textContent=win?'Happy Diwali!':'Game Over';document.getElementById('endIcon').textContent=win?'🎆':'💥';document.getElementById('endText').textContent=win?'You survived the celebration! Score: '+score:'You ran into a cracker. Score: '+score;document.getElementById('end').classList.remove('hidden')}
function jump(){if(!running)return;if(player.onGround){player.vy=-650;player.onGround=false;for(let i=0;i<18;i++)particles.push({x:player.x+20,y:groundY-5,vx:(Math.random()-.5)*180,vy:-Math.random()*220,life:.55});pop()}}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});document.getElementById('jumpBtn').onclick=jump;document.getElementById('start').onclick=startGame;document.getElementById('again').onclick=startGame;
function addObs(){let types=['cracker','rocket','wheel'];let type=types[Math.floor(Math.random()*types.length)];obs.push({x:W+30,y:groundY-42-(type==='rocket'?Math.random()*100:0),w:type==='wheel'?44:34,h:type==='wheel'?44:42,type,spin:Math.random()*6.2})}
function addCoin(){coinArr.push({x:W+20,y:groundY-80-Math.random()*150,r:11})}
function addFirework(){fw.push({x:60+Math.random()*(W-120),y:40+Math.random()*Math.min(230,H*.38),phase:0,life:1.2,color:['#ff4d6d','#ffd54f','#63e6ff','#d19cff'][Math.floor(Math.random()*4)]})}
function update(dt){time-=dt;if(time<=0){time=0;finish(true);return}score+=dt*10;player.vy+=1500*dt;player.y+=player.vy*dt;if(player.y>=groundY-player.h){player.y=groundY-player.h;player.vy=0;player.onGround=true}spawn-=dt;if(spawn<=0){addObs();spawn=.85+Math.random()*.8}coinSpawn-=dt;if(coinSpawn<=0){addCoin();coinSpawn=.9+Math.random()*.9}fireSpawn-=dt;if(fireSpawn<=0){addFirework();fireSpawn=.65+Math.random()*1.2}
for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.x-=350*dt;o.spin+=dt*7;if(hit(player,o)){obs.splice(i,1);lives--;for(let j=0;j<20;j++)particles.push({x:o.x+o.w/2,y:o.y+o.h/2,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,life:.7});pop();if(lives<=0){finish(false);return}}else if(o.x+o.w<0)obs.splice(i,1)}
for(let i=coinArr.length-1;i>=0;i--){let q=coinArr[i];q.x-=350*dt;if(hitCircle(player,q)){coinArr.splice(i,1);coins++;score+=35}else if(q.x+q.r<0)coinArr.splice(i,1)}
for(let i=fw.length-1;i>=0;i--){fw[i].phase+=dt*2.2;if(fw[i].phase>1.5)fw.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
for(let d of diyaArr){d.x-=350*dt;if(d.x< -30)d.x=W+Math.random()*120}}
function hit(a,b){return a.x+8<b.x+b.w&&a.x+a.w-8>b.x&&a.y+8<b.y+b.h&&a.y+a.h>b.y}function hitCircle(a,q){let cx=Math.max(a.x,Math.min(q.x,a.x+a.w)),cy=Math.max(a.y,Math.min(q.y,a.y+a.h));return (cx-q.x)**2+(cy-q.y)**2<q.r*q.r}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#060a2a');g.addColorStop(1,'#20144b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawStars();for(const f of fw)drawFirework(f);ctx.fillStyle='#161b39';ctx.fillRect(0,groundY,W,H-groundY);ctx.fillStyle='#ffb300';ctx.fillRect(0,groundY,W,3);for(const d of diyaArr)drawDiya(d.x,groundY+20);for(const q of coinArr)drawCoin(q);for(const o of obs)drawObstacle(o);drawBoy(player.x,player.y);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.7);ctx.fillStyle='#ffca28';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}document.getElementById('score').textContent=Math.floor(score);document.getElementById('lives').textContent=lives;document.getElementById('coins').textContent=coins;document.getElementById('time').textContent=Math.ceil(time)}
function drawStars(){ctx.fillStyle='#ffffff99';for(let i=0;i<70;i++){let x=(i*137)%W,y=25+(i*71)%(groundY*.7);ctx.fillRect(x,y,1.5,1.5)}}
function drawBoy(x,y){ctx.save();ctx.translate(x,y);let run=Math.sin(performance.now()/90)*6;ctx.fillStyle='#ffd1b3';ctx.beginPath();ctx.arc(21,10,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#24160f';ctx.beginPath();ctx.arc(21,7,10,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#e53935';ctx.fillRect(10,20,22,19);ctx.fillStyle='#1565c0';ctx.fillRect(13,39,8,12);ctx.fillRect(23,39,8,12);ctx.strokeStyle='#ffd1b3';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(12,24);ctx.lineTo(4,32+run);ctx.moveTo(31,24);ctx.lineTo(40,17-run);ctx.stroke();ctx.strokeStyle='#263238';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(17,50);ctx.lineTo(9,58+run);ctx.moveTo(27,50);ctx.lineTo(35,58-run);ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(7,57+run,9,3);ctx.fillRect(33,57-run,9,3);ctx.restore()}
function drawCoin(q){ctx.fillStyle='#ffd54f';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff3a0';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#9a6b00';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',q.x,q.y+1)}
function drawDiya(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#ff8f00';ctx.beginPath();ctx.ellipse(0,0,20,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffca28';ctx.beginPath();ctx.moveTo(-4,-7);ctx.quadraticCurveTo(0,-24,5,-7);ctx.quadraticCurveTo(0,-1,-4,-7);ctx.fill();ctx.fillStyle='#fff3a0';ctx.beginPath();ctx.arc(1,-10,3,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawFirework(f){let p=Math.min(1,f.phase);ctx.save();ctx.globalAlpha=Math.max(0,1-(f.phase-1)*2);ctx.fillStyle=f.color;ctx.strokeStyle=f.color;for(let i=0;i<20;i++){let a=i*Math.PI*2/20;let r=8+55*p;ctx.beginPath();ctx.moveTo(f.x+Math.cos(a)*8,f.y+Math.sin(a)*8);ctx.lineTo(f.x+Math.cos(a)*r,f.y+Math.sin(a)*r);ctx.stroke();ctx.beginPath();ctx.arc(f.x+Math.cos(a)*r,f.y+Math.sin(a)*r,2.5,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawObstacle(o){ctx.save();ctx.translate(o.x+o.w/2,o.y+o.h/2);if(o.type==='wheel'){ctx.rotate(o.spin);ctx.strokeStyle='#ff5252';ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.stroke();for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(a)*5,Math.sin(a)*5);ctx.lineTo(Math.cos(a)*20,Math.sin(a)*20);ctx.stroke()}ctx.fillStyle='#fff';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.fillText('CRACK',0,3)}else{ctx.fillStyle=o.type==='rocket'?'#42a5f5':'#ef5350';ctx.fillRect(-15,-20,30,40);ctx.fillStyle='#fff';ctx.fillRect(-11,-16,22,4);ctx.fillRect(-11,12,22,4);ctx.fillStyle='#ffca28';ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(-5,-20);ctx.lineTo(5,-20);ctx.fill()}ctx.restore()}
function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}reset();draw();
</script></body></html>
