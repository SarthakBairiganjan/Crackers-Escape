<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cracker Escape - Lite</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
body{font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh;background:#15102d}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;color:#fff;font:bold 18px Arial;z-index:2}
.badge{background:#0009;padding:8px 12px;border-radius:12px}
#start,#over,#win{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#08051dcc;z-index:5}
.box{width:min(90%,420px);text-align:center;background:#21143d;border:2px solid #ffd54f;border-radius:20px;padding:25px;color:#fff}
h1{margin:0 0 10px;color:#ffd54f;font-size:42px}
h2{color:#ffd54f}
button{border:0;border-radius:12px;padding:13px 22px;background:#ffd54f;color:#251238;font-weight:bold;font-size:17px;margin:6px;cursor:pointer}
.secondary{background:#fff}
.hidden{display:none!important}
#jump{position:fixed;bottom:20px;right:20px;z-index:3;width:90px;height:60px;border-radius:30px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="badge">❤️ <span id="lives">3</span> &nbsp; 🏆 <span id="score">0</span> &nbsp; 🪙 <span id="coins">0</span></div>
  <div class="badge">⏱ <span id="time">60</span></div>
</div>

<button id="jump">JUMP ↑</button>

<div id="start">
  <div class="box">
    <div style="font-size:45px">🪔 🎆 🧨</div>
    <h1>Cracker Escape</h1>
    <p>Jump over crackers and survive for 60 seconds.</p>
    <p>Every jump creates a cracker burst!</p>
    <button onclick="startGame()">START GAME</button>
  </div>
</div>

<div id="over" class="hidden">
  <div class="box">
    <div style="font-size:45px">💥🧨</div>
    <h2>Game Over</h2>
    <p>Score: <b id="finalScore">0</b></p>
    <button onclick="startGame()">PLAY AGAIN</button>
    <button class="secondary" onclick="home()">EXIT</button>
  </div>
</div>

<div id="win" class="hidden">
  <div class="box">
    <div style="font-size:55px">🪔✨🎆</div>
    <h2>Happy Diwali!</h2>
    <p>May your life be filled with light, joy and happiness.</p>
    <p>Score: <b id="winScore">0</b></p>
    <button onclick="startGame()">PLAY AGAIN</button>
    <button class="secondary" onclick="home()">EXIT</button>
  </div>
</div>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
let W=0,H=0;
let running=false;
let score=0,lives=3,time=60,coins=0;
let player={x:80,y:0,w:32,h:48,vy:0,ground:false};
let obstacles=[];
let coinsList=[];
let particles=[];
let fireworks=[];
let last=0,spawnTimer=0;

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  if(!running) player.y=ground()-player.h;
}
window.addEventListener("resize",resize);
resize();

function ground(){return H-100}

function home(){
  running=false;
  stopCrackerSound();
  document.getElementById("start").classList.remove("hidden");
  document.getElementById("over").classList.add("hidden");
  document.getElementById("win").classList.add("hidden");
}


let bgAudio=null, bgTimer=null;
function startCrackerSound(){
  if(bgTimer)return;
  try{
    bgAudio=bgAudio||new (window.AudioContext||window.webkitAudioContext)();
    if(bgAudio.state==='suspended')bgAudio.resume();
    const burst=()=>{
      if(!running){ stopCrackerSound(); return; }
      const now=bgAudio.currentTime;
      // Sharp firecracker pop + short crackle noise, synthesized locally.
      const pop=bgAudio.createOscillator(), pg=bgAudio.createGain();
      pop.type='triangle';
      pop.frequency.setValueAtTime(180+Math.random()*180,now);
      pop.frequency.exponentialRampToValueAtTime(55,now+.09);
      pg.gain.setValueAtTime(.0001,now);
      pg.gain.exponentialRampToValueAtTime(.16,now+.004);
      pg.gain.exponentialRampToValueAtTime(.0001,now+.13);
      pop.connect(pg);pg.connect(bgAudio.destination);pop.start(now);pop.stop(now+.14);

      const buffer=bgAudio.createBuffer(1,bgAudio.sampleRate*.12,bgAudio.sampleRate);
      const data=buffer.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*(1-i/data.length);
      const noise=bgAudio.createBufferSource(), ng=bgAudio.createGain(), nf=bgAudio.createBiquadFilter();
      nf.type='highpass'; nf.frequency.value=900;
      ng.gain.setValueAtTime(.0001,now+.01);
      ng.gain.exponentialRampToValueAtTime(.055,now+.018);
      ng.gain.exponentialRampToValueAtTime(.0001,now+.11);
      noise.buffer=buffer;noise.connect(nf);nf.connect(ng);ng.connect(bgAudio.destination);noise.start(now+.01);

      // Tiny delayed secondary pops to mimic a festive cracker chain.
      if(Math.random()<.7){
        setTimeout(()=>{ if(running) burstSmallPop(); },55+Math.random()*90);
      }
      bgTimer=setTimeout(burst,520+Math.random()*1050);
    };
    const burstSmallPop=()=>{
      const t=bgAudio.currentTime;
      const o=bgAudio.createOscillator(),g=bgAudio.createGain();
      o.type='square';o.frequency.setValueAtTime(95+Math.random()*80,t);o.frequency.exponentialRampToValueAtTime(38,t+.055);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+.075);
      o.connect(g);g.connect(bgAudio.destination);o.start(t);o.stop(t+.08);
    };
    burst();
  }catch(e){}
}
function stopCrackerSound(){
  if(bgTimer){clearTimeout(bgTimer);bgTimer=null;}
}

function startGame(){
  startCrackerSound();
  document.getElementById("start").classList.add("hidden");
  document.getElementById("over").classList.add("hidden");
  document.getElementById("win").classList.add("hidden");

  score=0;lives=3;time=60;coins=0;
  obstacles=[];coinsList=[];particles=[];fireworks=[];
  player.x=Math.max(50,W*.15);
  player.y=ground()-player.h;
  player.vy=0;
  player.ground=true;
  spawnTimer=.8;
  for(let i=0;i<5;i++) spawnFirework(true);
  running=true;
  last=performance.now();
  updateHUD();
  requestAnimationFrame(loop);
}

function jump(){
  if(!running || !player.ground)return;
  player.vy=-720;
  player.ground=false;
  score+=5;

  // Every jump creates the requested cracker burst.
  for(let i=0;i<16;i++){
    let a=Math.random()*Math.PI*2;
    let v=80+Math.random()*180;
    particles.push({
      x:player.x+player.w/2,
      y:player.y+player.h,
      vx:Math.cos(a)*v,
      vy:Math.sin(a)*v,
      life:.55
    });
  }
}
document.getElementById("jump").onclick=jump;
canvas.addEventListener("pointerdown",jump);
window.addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="ArrowUp"){
    e.preventDefault();
    jump();
  }
});

function addCoin(){
  coinsList.push({x:W+30,y:ground()-80-Math.random()*150,r:11,speed:300+Math.min(160,(60-time)*5),phase:Math.random()*Math.PI*2});
}
function spawnFirework(initial=false){
  fireworks.push({x:40+Math.random()*Math.max(80,W-80),y:45+Math.random()*Math.max(70,Math.min(220,H*.42)),life:1.1,delay:initial?Math.random()*.8:0,color:['#ff4d6d','#ffd54f','#5be7ff','#b388ff'][Math.floor(Math.random()*4)]});
}
function addObstacle(){
  let size=34;
  obstacles.push({
    x:W+20,
    y:ground()-size,
    w:size,
    h:size,
    speed:330+Math.min(170,(60-time)*5)
  });
}

function update(dt){
  time-=dt;
  if(time<=0){
    time=0;
    running=false;
    stopCrackerSound();
    document.getElementById("winScore").textContent=score;
    document.getElementById("win").classList.remove("hidden");
    return;
  }

  player.vy+=1800*dt;
  player.y+=player.vy*dt;

  if(player.y+player.h>=ground()){
    player.y=ground()-player.h;
    player.vy=0;
    player.ground=true;
  }

  spawnTimer-=dt;
  if(spawnTimer<=0){
    addObstacle();
    if(Math.random()<.72) addCoin();
    if(Math.random()<.12) spawnFirework();
    spawnTimer=Math.max(.55,1.05-(60-time)*.006);
  }

  for(let i=obstacles.length-1;i>=0;i--){
    let o=obstacles[i];
    o.x-=o.speed*dt;

    if(hit(player,o)){
      obstacles.splice(i,1);
      lives--;
      score=Math.max(0,score-20);
      if(lives<=0){
        running=false;
        stopCrackerSound();
        document.getElementById("finalScore").textContent=score;
        document.getElementById("over").classList.remove("hidden");
        return;
      }
    }else if(o.x+o.w<0){
      obstacles.splice(i,1);
      score+=10;
    }
  }

  for(let i=coinsList.length-1;i>=0;i--){
    let c=coinsList[i];
    c.x-=c.speed*dt;
    c.phase+=dt*5;
    let cy=c.y+Math.sin(c.phase)*5;
    if(hitCircle(player,c.x,cy,c.r)){
      coinsList.splice(i,1);coins++;score+=25;
    }else if(c.x+c.r<0) coinsList.splice(i,1);
  }
  for(let i=fireworks.length-1;i>=0;i--){
    let f=fireworks[i];
    f.life-=dt;
    if(f.delay>0) f.delay-=dt;
    if(f.life<=0) fireworks.splice(i,1);
  }

  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i];
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=500*dt;
    p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }

  updateHUD();
}

function hitCircle(a,cx,cy,r){
  let nx=Math.max(a.x,Math.min(cx,a.x+a.w));
  let ny=Math.max(a.y,Math.min(cy,a.y+a.h));
  return (nx-cx)*(nx-cx)+(ny-cy)*(ny-cy)<r*r;
}

function hit(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x &&
         a.y<b.y+b.h && a.y+a.h>b.y;
}

function updateHUD(){
  document.getElementById("lives").textContent=lives;
  document.getElementById("score").textContent=score;
  document.getElementById("coins").textContent=coins;
  document.getElementById("time").textContent=Math.ceil(time);
}

function draw(){
  // Background
  ctx.fillStyle="#15102d";
  ctx.fillRect(0,0,W,H);

  // Moon
  ctx.fillStyle="#fff1a8";
  ctx.beginPath();
  ctx.arc(W-90,80,32,0,Math.PI*2);
  ctx.fill();

  // Simple buildings
  ctx.fillStyle="#241943";
  for(let i=0;i<7;i++){
    let x=i*W/7;
    let h=70+(i%3)*35;
    ctx.fillRect(x,ground()-h,W/7+2,h);
  }

  // Stars
  ctx.fillStyle="#ffd54f";
  for(let i=0;i<35;i++){
    let x=(i*97)%W;
    let y=(i*53)%(ground()-40);
    ctx.fillRect(x,y,2,2);
  }

  // Animated fireworks in the night sky
  for(const f of fireworks) drawFirework(f.x,f.y,f.color,Math.max(0,1-f.life/1.1));

  // Ground
  ctx.fillStyle="#3c2444";
  ctx.fillRect(0,ground(),W,H-ground());

  // Diyas along the festive ground
  for(let i=45;i<W;i+=Math.max(150,W/5))drawDiya(i,ground()+25);

  // Floating collectible coins
  for(const c of coinsList){
    let cy=c.y+Math.sin(c.phase)*5;
    ctx.fillStyle="#ffd54f";
    ctx.beginPath();ctx.arc(c.x,cy,c.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff3a1";ctx.font="bold 12px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("₹",c.x,cy);
  }

  // Obstacles
  for(const o of obstacles){
    ctx.fillStyle="#e53935";
    ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle="#ffd54f";
    ctx.fillRect(o.x+4,o.y+o.h/2-2,o.w-8,4);
    ctx.fillStyle="#fff1a8";
    ctx.beginPath();
    ctx.arc(o.x+o.w/2,o.y-4,4,0,Math.PI*2);
    ctx.fill();
  }

  // Boy running icon
  drawBoy(player.x,player.y,performance.now()/120);

  // Burst particles
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/.55);
    ctx.fillStyle="#ffd54f";
    ctx.fillRect(p.x,p.y,4,4);
  }
  ctx.globalAlpha=1;
}

function drawDiya(x,y){
  ctx.fillStyle="#d77b1a";
  ctx.beginPath();
  ctx.ellipse(x,y,20,8,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#ffe66d";
  ctx.beginPath();
  ctx.moveTo(x,y-4);
  ctx.quadraticCurveTo(x-7,y-22,x,y-28);
  ctx.quadraticCurveTo(x+7,y-22,x,y-4);
  ctx.fill();
}

function drawFirework(x,y,color,progress){
  progress=progress||0;
  ctx.save();ctx.globalAlpha=.25+.75*(1-progress);ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2;
  let radius=10+30*progress;
  for(let i=0;i<16;i++){
    let a=i*Math.PI/8;
    ctx.beginPath();ctx.moveTo(x+Math.cos(a)*4,y+Math.sin(a)*4);ctx.lineTo(x+Math.cos(a)*radius,y+Math.sin(a)*radius);ctx.stroke();
    ctx.beginPath();ctx.arc(x+Math.cos(a)*radius,y+Math.sin(a)*radius,2.5,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawBoy(x,y,t){
  const swing=Math.sin(t)*4;
  ctx.save();
  // shadow
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x+17,y+49,17,4,0,0,Math.PI*2);ctx.fill();
  // legs in running pose
  ctx.strokeStyle='#193a8a';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x+15,y+34);ctx.lineTo(x+7+swing,y+47);ctx.lineTo(x-1+swing,y+47);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+18,y+34);ctx.lineTo(x+27-swing,y+43);ctx.lineTo(x+34-swing,y+43);ctx.stroke();
  // red shirt/body
  ctx.fillStyle='#e53935';ctx.beginPath();ctx.roundRect(x+6,y+16,22,20,7);ctx.fill();
  // arms
  ctx.strokeStyle='#ffd1b3';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(x+8,y+20);ctx.lineTo(x-1-swing,y+29);ctx.lineTo(x-7-swing,y+25);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+26,y+20);ctx.lineTo(x+34+swing,y+12);ctx.lineTo(x+40+swing,y+17);ctx.stroke();
  // head
  ctx.fillStyle='#ffd1b3';ctx.beginPath();ctx.arc(x+17,y+9,10,0,Math.PI*2);ctx.fill();
  // hair
  ctx.fillStyle='#3b2418';ctx.beginPath();ctx.arc(x+17,y+6,10,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(x+7,y+5,5,6);
  // eye
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x+21,y+9,1.2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function loop(now){
  if(!running)return;
  let dt=Math.min(.033,(now-last)/1000);
  last=now;
  update(dt);
  draw();
  if(running)requestAnimationFrame(loop);
}

draw();
</script>
</body>
</html>
