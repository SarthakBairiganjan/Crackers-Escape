<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cracker Escape — Diwali Runner</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b24;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{touch-action:none}.wrap{position:relative;width:100vw;height:100vh;display:grid;place-items:center}
canvas{width:100vw;height:100vh;display:block;background:#080b24}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(3,5,20,.42)}
.card{max-width:560px;width:min(92vw,560px);padding:30px 28px;border:2px solid #ffc83d;border-radius:24px;background:rgba(13,10,39,.92);color:#fff;text-align:center;box-shadow:0 0 60px rgba(255,174,0,.22)}
h1{font-size:clamp(34px,7vw,62px);margin:0 0 8px;color:#ffd43b;text-shadow:0 4px 0 #6b2b00}
p{font-size:18px;line-height:1.45;margin:10px 0;color:#eee}
button{border:0;border-radius:999px;background:#ffb51b;color:#241200;font-weight:900;font-size:20px;padding:14px 28px;cursor:pointer;box-shadow:0 7px 0 #9c4f00;margin-top:12px}
button:active{transform:translateY(4px);box-shadow:0 3px 0 #9c4f00}
.small{font-size:14px;color:#bbb}.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<canvas id="game"></canvas>
<div id="menu" class="overlay">
  <div class="card">
    <div style="font-size:54px">🪔 🧨 ✨</div>
    <h1>Cracker Escape</h1>
    <p>Jump over the crackers, collect diyas and coins, and survive the fireworks!</p>
    <p><b>SPACE / ↑ / TAP</b> to jump</p>
    <button id="start">START GAME</button>
    <p class="small">A festive endless runner — best played full-screen.</p>
  </div>
</div>
<div id="gameover" class="overlay hide">
  <div class="card">
    <div style="font-size:48px">💥</div>
    <h1>Game Over</h1>
    <p id="final"></p>
    <button id="again">PLAY AGAIN</button>
  </div>
</div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,dpr, running=false, last=0, score=0, best=+localStorage.crackerBest||0, lives=3, time=0, speed=330, spawn=0;
let player, objects=[], particles=[], clouds=[];

function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

function reset(){
 score=0;lives=3;time=0;speed=330;spawn=.7;objects=[];particles=[];
 player={x:Math.max(90,W*.22),y:H*.72,w:58,h:76,vy:0,onGround:true,inv:0};
 clouds=[...Array(5)].map((_,i)=>({x:i*260+80,y:80+Math.random()*110,s:30+Math.random()*35}));
}
function jump(){if(!running)return;if(player.onGround){player.vy=-790;player.onGround=false}}
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()}});
c.addEventListener('pointerdown',jump);

function addObj(){
 const r=Math.random();
 let type=r<.68?'cracker':r<.84?'diya':'coin';
 let y=ground()- (type==='cracker'?30:36);
 if(type==='cracker' && Math.random()<.35)y-=45;
 objects.push({type,x:W+50,y,w:type==='cracker'?58:42,h:type==='cracker'?38:42,rot:0,hit:false});
}
function ground(){return H*.82}
function burst(x,y,n=14){
 for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*360,vy:(Math.random()-.7)*360,life:.55+Math.random()*.5,sz:2+Math.random()*4});
}
function rectHit(a,b){return a.x<a2(b)&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function a2(b){return b.x}
function collide(a,b){return a.x < b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y}

function update(dt){
 time+=dt;score+=dt*12;speed+=dt*3;
 player.vy+=1850*dt;player.y+=player.vy*dt;
 if(player.y+player.h>=ground()){player.y=ground()-player.h;player.vy=0;player.onGround=true}
 if(player.inv>0)player.inv-=dt;
 spawn-=dt;if(spawn<=0){addObj();spawn=Math.max(.45,1.0-(speed-330)/1100)*(.65+Math.random()*.65)}
 for(const o of objects){
   o.x-=speed*dt;o.rot+=dt*3;
   if(!o.hit && collide(player,o)){
     o.hit=true;burst(o.x+o.w/2,o.y+o.h/2,18);
     if(o.type==='cracker'){if(player.inv<=0){lives--;player.inv=1.1;burst(player.x+30,player.y+30,28);if(lives<=0)endGame()}}
     else if(o.type==='diya'){score+=40}
     else {score+=75}
   }
 }
 objects=objects.filter(o=>o.x>-100&&!o.hit);
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt;p.life-=dt}
 particles=particles.filter(p=>p.life>0);
}

function draw(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07164b');g.addColorStop(1,'#25103f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // moon and skyline
 ctx.fillStyle='#ffd86b';ctx.beginPath();ctx.arc(W*.82,H*.16,35,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='rgba(255,216,107,.12)';ctx.beginPath();ctx.arc(W*.82,H*.16,58,0,Math.PI*2);ctx.fill();
 for(let i=0;i<14;i++){let x=i*110-(time*18%110);let bh=70+(i%5)*25;ctx.fillStyle=i%2?'#241c54':'#30205c';ctx.fillRect(x,ground()-bh,90,bh)}
 // fireworks
 for(let k=0;k<4;k++){let x=(k*.31+.1)*W,y=H*(.12+.08*(k%2));ctx.strokeStyle='rgba(255,193,67,.6)';ctx.lineWidth=2;for(let i=0;i<10;i++){let a=i*Math.PI/5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*35,y+Math.sin(a)*35);ctx.stroke()}}
 // ground
 ctx.fillStyle='#4b3155';ctx.fillRect(0,ground(),W,H-ground());
 ctx.strokeStyle='#f8b83d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,ground());ctx.lineTo(W,ground());ctx.stroke();
 for(let x=0;x<W;x+=48){ctx.fillStyle='#ffc83d';ctx.beginPath();ctx.arc(x,ground()+16,3,0,Math.PI*2);ctx.fill()}
 // diyas along edge
 for(let x=30;x<W;x+=150){drawDiya(x,ground()+35, .75)}
 // player
 if(player.inv<=0 || Math.floor(player.inv*12)%2===0)drawPlayer(player.x,player.y);
 // objects
 for(const o of objects){if(o.type==='cracker')drawCracker(o.x,o.y,o.w,o.h);else if(o.type==='diya')drawDiya(o.x+20,o.y+22,1);else drawCoin(o.x+21,o.y+21)}
 // particles
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#ffd34d';ctx.fillRect(p.x,p.y,p.sz,p.sz)}ctx.globalAlpha=1;
 hud();
}
function drawPlayer(x,y){
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle='#1a1024';ctx.beginPath();ctx.ellipse(29,72,25,6,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#e52d2d';ctx.fillRect(12,25,34,34);ctx.fillStyle='#ffd34d';ctx.fillRect(28,25,5,34);
 ctx.fillStyle='#ffd6b0';ctx.beginPath();ctx.arc(29,15,16,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#24120e';ctx.beginPath();ctx.arc(29,10,17,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff';ctx.fillRect(21,12,5,5);ctx.fillRect(32,12,5,5);
 ctx.fillStyle='#222';ctx.beginPath();ctx.arc(24,14,2,0,Math.PI*2);ctx.arc(34,14,2,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#ffd6b0';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(12,31);ctx.lineTo(-2,45);ctx.moveTo(46,31);ctx.lineTo(61,20);ctx.stroke();
 ctx.fillStyle='#f1f1f1';ctx.fillRect(14,58,14,14);ctx.fillRect(34,58,14,14);
 ctx.fillStyle='#e52d2d';ctx.fillRect(9,69,20,5);ctx.fillRect(35,69,20,5);ctx.restore();
}
function drawCracker(x,y,w,h){
 ctx.save();ctx.translate(x,y);ctx.fillStyle='#d62b25';ctx.fillRect(0,8,w,h-8);
 ctx.fillStyle='#ffd34d';for(let i=6;i<w;i+=13)ctx.fillRect(i,12,4,h-16);
 ctx.fillStyle='#ffef91';ctx.beginPath();ctx.arc(w-2,4,6,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#ffd34d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w-2,4);ctx.lineTo(w+8,-5);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(w+8,-5,3,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawDiya(x,y,s=1){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#d98616';ctx.beginPath();ctx.ellipse(0,8,25,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffb72b';ctx.beginPath();ctx.moveTo(0,-5);ctx.quadraticCurveTo(-7,5,0,9);ctx.quadraticCurveTo(7,5,0,-5);ctx.fill();ctx.fillStyle='#fff1a3';ctx.beginPath();ctx.arc(0,-2,4,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawCoin(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#ffc928';ctx.beginPath();ctx.arc(0,0,17,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff0a0';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#8b4c00';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,1);ctx.restore()}
function hud(){
 ctx.fillStyle='rgba(5,6,24,.72)';round(16,16,Math.min(W-32,620),62,20);ctx.fill();
 ctx.fillStyle='#fff';ctx.font='bold 20px system-ui';ctx.fillText('❤️'.repeat(lives),32,56);
 ctx.fillStyle='#ffd43b';ctx.fillText('Score: '+Math.floor(score),170,56);
 ctx.fillStyle='#fff';ctx.fillText('Best: '+Math.max(best,Math.floor(score)),330,56);
 ctx.fillText('⏱ '+Math.floor(time)+'s',490,56);
}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.closePath()}
function endGame(){running=false;best=Math.max(best,Math.floor(score));localStorage.crackerBest=best;document.getElementById('final').textContent=`Score: ${Math.floor(score)}  •  Best: ${best}`;document.getElementById('gameover').classList.remove('hide')}
function loop(t){if(!last)last=t;let dt=Math.min(.033,(t-last)/1000);last=t;if(running){update(dt);draw();requestAnimationFrame(loop)}}
function start(){document.getElementById('menu').classList.add('hide');document.getElementById('gameover').classList.add('hide');reset();running=true;last=0;requestAnimationFrame(loop)}
document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;
reset();draw();
</script>
</body>
</html>
